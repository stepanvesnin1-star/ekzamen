    <h1>Формирование заявки</h1>
    <p>Заполните форму ниже, чтобы оставить заявку</p>

    <div class="form_main">
        <form>
    <div class="mb-3">
      <label for="disabledSelect" class="form-label">Наименование курса</label>
      <select id="disabledSelect" class="form-select">
        <option>IT</option>
        <option>Экономика</option>
        <option>Высшая математика</option>
      </select>
    </div>
  <div class="mb-3">
    <label for="dateStart" class="form-label">Дата начала обучения</label>
    <input type="date" class="form-control" id="dateStart" required>
  </div>
    <div class="mb-3">
      <label for="disabledSelect" class="form-label">Выберите удобный способ оплаты</label>

        <option>Наличными</option>
        <option>Переводом по номеру телефона</option>
      </select>
    </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" required id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Подтверждаю создание заявки</label>
  </div>
